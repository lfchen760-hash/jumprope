name: CI

permissions:
  contents: write

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # ── 1. 纯 Dart 核心：算法一致性 ──────────────────
  dart-core:
    name: Dart 核心测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: 静态分析
        working-directory: dart_core
        run: dart analyze

      - name: 单元测试（黄金向量 + 姿态 + 回放 + 会话）
        working-directory: dart_core
        run: dart run test/all_tests.dart

  # ── 2. Flutter 外壳：Dart 侧分析 ────────────────
  flutter:
    name: Flutter 分析
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 解析依赖
        working-directory: flutter_app
        run: flutter pub get

      - name: 静态分析
        working-directory: flutter_app
        run: |
          set -o pipefail
          flutter analyze 2>&1 | tee /tmp/flutter_analyze.log

      - name: 数据层单元测试
        working-directory: flutter_app
        run: |
          set -o pipefail
          flutter test 2>&1 | tee /tmp/flutter_test.log

      - name: 失败日志推回仓库
        if: failure()
        run: |
          mkdir -p ci-logs
          cp /tmp/flutter_analyze.log ci-logs/ 2>/dev/null || true
          cp /tmp/flutter_test.log ci-logs/ 2>/dev/null || true
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git checkout -B ci-logs-flutter
          git add -f ci-logs
          git commit -m "ci: flutter analyze/test log [skip ci]" || true
          git push -f origin ci-logs-flutter
