name: Android 构建（实验）

# 手动触发：首次运行大概率失败，需要按日志逐步修。
# 目的不是发版，而是把 Kotlin 的编译错误暴露出来。

on:
  # 改了 Flutter/原生代码就自动跑，把编译错误尽早暴露
  push:
    paths:
      - 'flutter_app/**'
      - '.github/scripts/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:
    inputs:
      build_apk:
        description: "是否真的构建 APK（否则只做 analyze）"
        type: boolean
        default: true
      upload_token:
        description: "上传令牌（可选；配置了 UPLOAD_TOKEN secret 则无需填写）"
        type: string
        required: false

jobs:
  build:
    name: 生成脚手架并构建
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 用于失败时把日志推回 ci-logs 分支
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # 缓存 Gradle 发行包与依赖：既提速，也避免 GitHub 抖动时每次重下
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: 下载姿态模型
        run: |
          mkdir -p flutter_app/assets
          curl -sSL -o flutter_app/assets/pose_landmarker_lite.task \
            "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task"
          ls -lh flutter_app/assets/

      - name: 生成 Flutter 脚手架
        run: |
          flutter create --org com.jumprope --platforms=android \
            --project-name jumprope_app ci_app

      - name: 覆盖我们的源码
        run: |
          rm -rf ci_app/lib
          cp -r flutter_app/lib ci_app/lib
          cp flutter_app/pubspec.yaml ci_app/pubspec.yaml
          mkdir -p ci_app/assets
          cp flutter_app/assets/*.task ci_app/assets/
          mkdir -p ci_app/android/app/src/main/kotlin/com/jumprope
          cp -r flutter_app/android/app/src/main/kotlin/com/jumprope/. \
                ci_app/android/app/src/main/kotlin/com/jumprope/

      - name: 注册插件 + 权限 + 依赖
        run: bash .github/scripts/prepare_android.sh ci_app

      - name: 安装 Gradle 镜像配置
        run: |
          mkdir -p ~/.gradle
          cp .github/scripts/init.gradle ~/.gradle/init.gradle
          echo "已安装 init.gradle："
          head -5 ~/.gradle/init.gradle

      - name: 解析依赖
        working-directory: ci_app
        run: flutter pub get

      - name: 静态分析
        working-directory: ci_app
        run: flutter analyze || true

      - name: 构建 APK
        if: ${{ github.event_name == 'push' || inputs.build_apk }}
        working-directory: ci_app
        run: |
          set -o pipefail
          # release + 仅 arm64：体积约为 debug 全架构的 1/5，手机下载更快
          flutter build apk --release --target-platform android-arm64 2>&1 | tee /tmp/build.log

      - name: 失败时把日志推回仓库
        if: failure()
        run: |
          mkdir -p ci-logs
          {
            echo "# 构建失败日志"
            echo
            echo "提交: ${{ github.sha }}"
            echo "时间: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            echo "## 复现命令"
            echo '```'
            echo "flutter build apk --release --target-platform android-arm64"
            echo '```'
            echo
            echo "## 日志（末尾 600 行）"
            echo '```'
            tail -n 600 /tmp/build.log 2>/dev/null || echo "（没有产生 /tmp/build.log）"
            echo '```'
          } > ci-logs/build-error.log

          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git checkout -B ci-logs
          git add -f ci-logs/build-error.log
          git commit -m "ci: 构建失败日志 [skip ci]" || true
          git push -f origin ci-logs

      - name: 上传 APK（GitHub 制品）
        if: ${{ (github.event_name == 'push' || inputs.build_apk) && success() }}
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: ci_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7

      - name: 发布到 Release（供服务器自动拉取）
        if: ${{ (github.event_name == 'push' || inputs.build_apk) && success() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK=ci_app/build/app/outputs/flutter-apk/app-release.apk
          cp "$APK" jumprope.apk
          ls -lh jumprope.apk

          # Release 资产是公开可下载的，服务器无需任何凭证即可拉取
          gh release view debug-latest >/dev/null 2>&1 \
            || gh release create debug-latest \
                 --title "Debug 构建" \
                 --notes "自动构建产物，最新一次构建会覆盖" \
                 --prerelease

          # 清掉旧的 debug 资产，避免混淆
          gh release delete-asset debug-latest jumprope-debug.apk -y 2>/dev/null || true
          gh release upload debug-latest jumprope.apk --clobber
          echo "已发布: https://github.com/${GITHUB_REPOSITORY}/releases/tag/debug-latest"
